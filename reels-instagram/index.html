<!DOCTYPE html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f4f4f5;
      }
      /* Zone sûre Reels : ~250px en haut (en-tête), ~420px en bas (légende,
         boutons), ~120px à droite (like / commentaire / partage). */
      .safe {
        position: absolute;
        top: 250px;
        bottom: 420px;
        left: 80px;
        right: 140px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 40px;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .kicker {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #facc15;
      }
      .headline {
        font-size: 120px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .body {
        font-size: 52px;
        font-weight: 500;
        line-height: 1.25;
        color: #d4d4d8;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qv3y" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div data-hf-id="hf-d9v4" class="scene clip" id="scene-accroche" data-composition-id="accroche" data-composition-src="compositions/accroche.html" data-start="0" data-duration="5" data-track-index="0"></div>
      <div data-hf-id="hf-3uhy" class="scene clip" id="scene-message" data-composition-id="message" data-composition-src="compositions/message.html" data-start="5" data-duration="5" data-track-index="0"></div>
      <div data-hf-id="hf-ig11" class="scene clip" id="scene-cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="10" data-duration="5" data-track-index="0"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
