      <canvas id="c-fx" class="clip couche" data-layout-allow-occlusion width="1080" height="1920" data-start="0" data-duration="13" data-track-index="2"></canvas>

      <div id="titre" class="clip" data-start="0" data-duration="13" data-track-index="3">
        <div class="script">La touche secrète qui transforme</div>
        <div class="gras">VOS GRILLADES</div>
        <div class="sous">Le goût qui fait la différence</div>

    <script>
      (function () {
        const W = 1080;
        const H = 1920;
        const CX = 540;
        const CY = 910;
        const DUREE = 13;
        const DEG = Math.PI / 180;

        // ---------- Outils ----------
        const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const phase = (t, a, b) => clamp((t - a) / (b - a));
        const eio = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
        const eo = (p) => 1 - Math.pow(1 - p, 3);
        const ei = (p) => p * p * p;
        const toile = (w, h) => {
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          return c;
        };
        // Pseudo-aléatoire déterministe (mulberry32).
        const generateur = (graine) => () => {
          graine |= 0;
          graine = (graine + 0x6d2b79f5) | 0;
          let x = Math.imul(graine ^ (graine >>> 15), 1 | graine);
          x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
          return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
        };
        const alea = generateur(20260928);

        // Bruit de valeur + fbm, pour les textures générées une seule fois.
        const hache = (i, j, s) => {
          let h = (i * 374761393 + j * 668265263 + s * 1442695041) | 0;
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        };
        const bruit = (x, y, s) => {
          const i = Math.floor(x);
          const j = Math.floor(y);
          const fx = x - i;
          const fy = y - j;
          const u = fx * fx * (3 - 2 * fx);
          const v = fy * fy * (3 - 2 * fy);
          const a = hache(i, j, s);
          const b = hache(i + 1, j, s);
          const c = hache(i, j + 1, s);
          const d = hache(i + 1, j + 1, s);
          return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        };
        const fbm = (x, y, s, o = 5) => {
          let t = 0;
          let a = 0.5;
          let f = 1;
          let n = 0;
          for (let k = 0; k < o; k++) {
            t += a * bruit(x * f, y * f, s + k * 17);
            n += a;
            a *= 0.5;
            f *= 2;
          }
          return t / n;
        };

        // ---------- Textures ----------
        // Plan de travail : argile / pierre terracotta sombre.
        const sol = (() => {
          const w = 540;
          const h = 960;
          const c = toile(w, h);
          const g = c.getContext("2d");
          const img = g.createImageData(w, h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const n = fbm(x / 70, y / 70, 3, 5);
              const m = fbm(x / 6, y / 6, 9, 2);
              const k = clamp(n * 1.25 - 0.1) * 0.8 + m * 0.2;
              const i = (y * w + x) * 4;
              img.data[i] = lerp(52, 112, k);
              img.data[i + 1] = lerp(21, 50, k);
              img.data[i + 2] = lerp(14, 32, k);
              img.data[i + 3] = 255;
            }
          }
          g.putImageData(img, 0, 0);
          return c;
        })();

        // Charbon : relief éclairé + cendre.
        const RES_C = 2;
        const charbonTex = (() => {
          const w = 160 * RES_C;
          const h = 220 * RES_C;
          const c = toile(w, h);
          const g = c.getContext("2d");
          const img = g.createImageData(w, h);
          const haut = (x, y) => fbm(x / 16, y / 16, 21, 5) + 0.45 * fbm(x / 4, y / 4, 33, 3);
          const L = [-0.5, -0.6, 0.62];
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const ux = x / RES_C;
              const uy = y / RES_C;
              const h0 = haut(ux, uy);
              const nx = (haut(ux + 0.6, uy) - h0) * -9;
              const ny = (haut(ux, uy + 0.6) - h0) * -9;
              const nl = Math.hypot(nx, ny, 1);
              const ombre = clamp(0.25 + 1.1 * ((nx * L[0] + ny * L[1] + L[2]) / nl));
              const cendre = fbm(ux / 3, uy / 3, 51, 2) > 0.66 ? 1 : 0;
              const i = (y * w + x) * 4;
              img.data[i] = lerp(18, 74, ombre) + cendre * 60;
              img.data[i + 1] = lerp(16, 68, ombre) + cendre * 56;
              img.data[i + 2] = lerp(15, 64, ombre) + cendre * 52;
              img.data[i + 3] = 255;
            }
          }
          g.putImageData(img, 0, 0);
          return c;
        })();

        // Fumée douce.
        const fumee = (() => {
          const s = 256;
          const c = toile(s, s);
          const g = c.getContext("2d");
          const img = g.createImageData(s, s);
          for (let y = 0; y < s; y++) {
            for (let x = 0; x < s; x++) {
              const wx = fbm(x / 60, y / 60, 71, 3) * 3;
              const n = fbm(x / 48 + wx, y / 48 - wx, 77, 5);
              const r = Math.hypot(x - s / 2, y - s / 2) / (s / 2);
              const a = clamp((n - 0.42) * 3.2) * clamp(1 - r * r);
              const i = (y * s + x) * 4;
              img.data[i] = 236;
              img.data[i + 1] = 214;
              img.data[i + 2] = 198;
              img.data[i + 3] = a * 255;
            }
          }
          g.putImageData(img, 0, 0);
          return c;
        })();

        // Grain pellicule : 3 planches qui tournent.
        const grains = [0, 1, 2].map((k) => {
          const w = 540;
          const h = 960;
          const c = toile(w, h);
          const g = c.getContext("2d");
          const img = g.createImageData(w, h);
          const r = generateur(900 + k);
          for (let i = 0; i < w * h; i++) {
            const v = 128 + (r() - 0.5) * 150;
            img.data[i * 4] = v;
            img.data[i * 4 + 1] = v;
            img.data[i * 4 + 2] = v;
            img.data[i * 4 + 3] = 255;
          }
          g.putImageData(img, 0, 0);
          return c;
        });

        // ---------- Sprites ----------
        // Piment séché : longueur nominale 150 px à l'échelle 1.
        const RES_P = 1.5;
        const cheminSec = (g, courbe) => {
          g.beginPath();
          g.moveTo(-2, -66);
          g.bezierCurveTo(14, -68, 23, -50, 22, -24);
          g.bezierCurveTo(21, 6, 14 + courbe, 38, 4 + courbe * 1.6, 62);
          g.bezierCurveTo(1 + courbe * 2, 70, -3 + courbe * 2.2, 76, -6 + courbe * 2.4, 78);
          g.bezierCurveTo(-9 + courbe * 2, 70, -16 + courbe, 44, -19, 14);
          g.bezierCurveTo(-22, -18, -20, -58, -2, -66);
          g.closePath();
        };
        const fabriquePimentSec = (graine, courbe, teinte) => {
          const r = generateur(graine);
          const c = toile(Math.ceil(80 * RES_P), Math.ceil(206 * RES_P));
          const g = c.getContext("2d");
          g.translate(c.width / 2, c.height / 2 + 6 * RES_P);
          g.scale(RES_P, RES_P);
          cheminSec(g, courbe);
          const lin = g.createLinearGradient(-22, 0, 22, 0);
          lin.addColorStop(0, teinte[0]);
          lin.addColorStop(0.3, teinte[1]);
          lin.addColorStop(0.5, teinte[2]);
          lin.addColorStop(0.75, teinte[1]);
          lin.addColorStop(1, teinte[3]);
          g.fillStyle = lin;
          g.fill();
          g.save();
          cheminSec(g, courbe);
          g.clip();
          // Plis longitudinaux en relief.
          for (let k = 0; k < 12; k++) {
            const x0 = -19 + k * 3.4 + (r() - 0.5) * 2;
            const w1 = (r() - 0.5) * 8;
            const w2 = (r() - 0.5) * 8;
            g.beginPath();
            g.moveTo(x0, -64);
            g.bezierCurveTo(x0 + w1, -20, x0 * 0.7 + w2, 30, x0 * 0.25 + courbe * 2, 76);
            g.strokeStyle = "rgba(30,2,1,0.38)";
            g.lineWidth = 1.3;
            g.stroke();
            g.translate(1.1, 0);
            g.strokeStyle = "rgba(255,120,90,0.16)";
            g.lineWidth = 0.9;
            g.stroke();
            g.translate(-1.1, 0);
          }
          // Plis transversaux.
          for (let k = 0; k < 7; k++) {
            const y0 = -50 + r() * 110;
            g.beginPath();
            g.moveTo(-22, y0);
            g.quadraticCurveTo(0, y0 + (r() - 0.5) * 10, 22, y0 + (r() - 0.5) * 6);
            g.strokeStyle = "rgba(30,2,1,0.22)";
            g.lineWidth = 1;
            g.stroke();
          }
          // Brillance.
          g.globalCompositeOperation = "screen";
          g.filter = "blur(2.5px)";
          g.beginPath();
          g.moveTo(-9, -54);
          g.bezierCurveTo(-13, -20, -11, 20, -4 + courbe, 50);
          g.strokeStyle = "rgba(255,200,180,0.55)";
          g.lineWidth = 4.5;
          g.stroke();
          g.filter = "blur(1px)";
          g.beginPath();
          g.moveTo(-8, -44);
          g.bezierCurveTo(-10, -26, -10, -8, -9, 6);
          g.strokeStyle = "rgba(255,235,225,0.6)";
          g.lineWidth = 1.6;
          g.stroke();
          g.filter = "blur(3px)";
          g.beginPath();
          g.moveTo(14, -40);
          g.bezierCurveTo(16, -10, 12, 20, 6 + courbe, 46);
          g.strokeStyle = "rgba(255,120,80,0.28)";
          g.lineWidth = 4;
          g.stroke();
          // Bords assombris.
          g.globalCompositeOperation = "source-over";
          g.filter = "blur(3px)";
          cheminSec(g, courbe);
          g.strokeStyle = "rgba(18,0,0,0.55)";
          g.lineWidth = 7;
          g.stroke();
          g.restore();
          g.filter = "none";
          // Calice et queue.
          g.beginPath();
          g.moveTo(-15, -64);
          g.bezierCurveTo(-12, -76, 12, -78, 16, -64);
          g.bezierCurveTo(10, -58, 4, -62, 0, -58);
          g.bezierCurveTo(-4, -62, -10, -58, -15, -64);
          const cal = g.createLinearGradient(-15, -78, 16, -58);
          cal.addColorStop(0, "#7C6B30");
          cal.addColorStop(1, "#3A2E10");
          g.fillStyle = cal;
          g.fill();
          g.beginPath();
          g.moveTo(1, -72);

        const TEINTES_SEC = [

        // Petites épices : flocons de piment, cumin, coriandre, poivre, graines.

        };
        const TYPES_EPICES = ["flocon", "flocon", "flocon", "cumin", "cumin", "coriandre", "poivre", "graine"];
        const EPICES = [];
        TYPES_EPICES.forEach((t, k) => {

        // Lit d'épices moulues sous le tas (paprika, piment, cumin).
        const poudre = (() => {

        // ---------- Formes principales ----------
        // Piment frais : paramétrage commun avec la fleur pour un morphing continu.

        // Charbon, couvercle, coupelle et fissure.

        const FISSURE = [[-71, -12], [-50, -18], [-40, -26], [-26, -10], [-12, -4], [2, -22], [14, -28], [26, -12], [40, -8], [54, -20], [70, -14]];

        }

        // ---------- Piments et épices du tas ----------
        const NB_PIMENTS = 84;

        const items = [];

        for (let i = 0; i < NB_PIMENTS; i++) {

        // Les 8 piments de la rosace : n° 0 au centre, 1-7 en couronne.

        items.forEach((p) => {
          if (p.rosace !== undefined) {

            p.tf = 10.52 + alea() * 0.1;
            const a = alea() * Math.PI * 2;

            const b = alea() * Math.PI * 2;

        // Ordre d'affichage mélangé.
        const ordre = items.map((p) => [alea(), p]).sort((a, b) => a[0] - b[0]).map((e) => e[1]);

        // Échelle du charbon (zoom à l'éclatement).
        const echCharbon = (t) => lerp(1, 1.08, eio(phase(t, 3.2, 4.35))) * lerp(1, 1.24, eo(phase(t, 4.35, 4.75)));

        const poseHeros = (t) => {
          const S = echCharbon(t);
          const dansCharbon = [CX + 6 * S, CY + 22 * S, -14, 0.78 * S];
          const seul = [CX, CY, 8, 1.3 * (1 + 0.012 * Math.sin((t - 6.2) * 3))];

            return dansCharbon.map((v, i) => lerp(v, seul[i], m));

          const dx = x - CX;
          const dy = y - CY;
          let X = dx * Math.cos(phi) - dy * Math.sin(phi);
          let Y = dx * Math.sin(phi) + dy * Math.cos(phi);

          Y *= s;
          const m = eio(phase(t, 11.65, 12.25));

        // Position d'un élément du tas à l'instant t → [x, y, rot°, échelle, opacité].
        const pose = (p, t) => {
          const sl = p.slot;
          const cible = () => {
            const q = tas(t, sl[0], sl[1]);
            return [q[0], q[1], sl[2], sl[3] * q[2]];
          };
          if (p.rosace !== undefined) {
            let pr;
            if (p.rosace === 0) {
              pr = poseHeros(Math.min(t, 7.55));
              if (t > 7.55) pr = [CX, CY, -12 + 3.6 * phase(t, 7.55, 9.9) * 2.35, 0.95 * lerp(1, 1.03, phase(t, 7.55, 9.9))];
            } else {
              const th = 0.05 * (clamp(t, 7.55, 9.9) - 7.55);
              const g = lerp(1, 1.03, phase(t, 7.55, 9.9));
              const a = p.ang + th;
              const rotRad = (a / DEG) - 90;
              let r;
              let spin = 0;

              if (t < 7.18) {

                spin = 160 * (1 - k);
              } else {

            return [lerp(pr[0], c[0], k), lerp(pr[1], c[1], k), lerp(pr[2], c[2], k), lerp(pr[3], c[3], k), 1];
          }
          if (t < p.t0) return null;
          const c = cible();
          const rot = sl[2] + p.spin * (1 - eo(phase(t, p.t0, p.tf)));
          if (t < p.tc) {
            const k = eo(phase(t, p.t0, p.tc));
            return [lerp(p.dep[0], p.chaos[0], k), lerp(p.dep[1], p.chaos[1], k), rot, sl[3] * 1.15, 1];

        // Cadrage : plan serré comme la référence, qui s'élargit quand le tas monte vers le sachet.
        const cadrage = (t) => lerp(1.32, 1, eio(phase(t, 11.6, 12.25)));
        let camera = null;

        // ---------- Dessin ----------
        const cv = document.getElementById("c-scene");

        const ombre = (g, s, force = 1) => {

          g.shadowOffsetX = 0;

        const sprite = (g, spr, res, x, y, rot, s, a = 1) => {

          g.translate(x, y);

        };

        function fond(t) {
          ctx.drawImage(sol, 0, 0, W, H);
          // Lumière clé chaude, haut gauche.
          const cle = ctx.createRadialGradient(430, 760, 60, 540, 900, 1250);

        function pimentFrais(t) {

          ombre(ctx, 1.2);
          // Corps : blanc de fleur → rouge brillant.
          trace(ctx, pts);
          const lin = ctx.createLinearGradient(-A, 0, A, 0);

        // Brillances du piment frais (dans un clip déjà posé).
        function reflets(g) {
          g.save();

          g.beginPath();

          g.filter = "blur(2px)";
          g.beginPath();
          g.moveTo(-40, -130);
          g.bezierCurveTo(-48, -80, -46, -30, -38, 10);
          g.strokeStyle = "rgba(255,245,240,0.85)";
          g.lineWidth = 4;
          g.stroke();
          g.filter = "blur(10px)";
          g.beginPath();
          g.moveTo(66, -120);
          g.bezierCurveTo(70, -20, 50, 80, 30, 160);
          g.strokeStyle = "rgba(255,120,70,0.35)";
          g.lineWidth = 14;
          g.stroke();
          g.globalCompositeOperation = "multiply";
          g.filter = "blur(18px)";
          g.beginPath();
          g.moveTo(0, 130);
          g.lineTo(20, 230);
          g.strokeStyle = "rgba(90,10,6,0.55)";
          g.lineWidth = 70;
          g.stroke();
          g.restore();
        }

        // Tige + calice ; `haut` = y du sommet du fruit, `m` = avancement du morphing.
        function tige(t, haut, m) {
          ctx.save();
          ombre(ctx, 1);
          ctx.translate(0, haut + 4);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(6, -40, -10, -70, 4, -112);
          ctx.bezierCurveTo(12, -140, 34, -156, 58, -170);
          ctx.strokeStyle = "#5C4A2A";
          ctx.lineWidth = 13;
          ctx.lineCap = "round";
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(4, -112);
          ctx.bezierCurveTo(-14, -128, -28, -130, -44, -146);
          ctx.lineWidth = 8;
          ctx.stroke();
          sansOmbre(ctx);
          ctx.beginPath();
          ctx.moveTo(-2, -4);
          ctx.bezierCurveTo(4, -40, -12, -70, 2, -112);
          ctx.strokeStyle = "rgba(210,190,140,0.35)";
          ctx.lineWidth = 3;
          ctx.stroke();
          // Bourgeon.
          ctx.beginPath();
          ctx.ellipse(62, -174, 9, 6, -0.6, 0, Math.PI * 2);
          ctx.fillStyle = "#7A5A36";
          ctx.fill();
          // Calice vert (apparaît avec le piment).
          ctx.globalAlpha = m;
          ctx.beginPath();
          for (let k = 0; k <= 10; k++) {
            const a = Math.PI + (k / 10) * Math.PI;
            const r = k % 2 ? 22 : 40;
            ctx[k ? "lineTo" : "moveTo"](Math.cos(a) * r, 8 + Math.sin(a) * r * 0.45);
          }
          ctx.quadraticCurveTo(0, 24, -40, 8);
          const cg = ctx.createLinearGradient(-40, -10, 40, 20);
          cg.addColorStop(0, "#6E9A3A");
          cg.addColorStop(1, "#2E5218");
          ctx.fillStyle = cg;
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.restore();
        }

        // Intensité des braises.
        const lueur = (t) => {
          const scint = 0.07 * Math.sin(t * 11) + 0.05 * Math.sin(t * 23 + 1);
          if (t < 3.2) return 0.55 + scint;
          if (t < 4.35) return lerp(0.55, 1, ei(phase(t, 3.2, 4.35))) + scint;
          return lerp(1.15, 0.7, eo(phase(t, 4.35, 5.9))) + scint;
        };

        function ligneLueur(g, pts, I) {
          if (I <= 0) return;
          g.save();
          g.globalCompositeOperation = "lighter";
          g.lineCap = "round";
          g.lineJoin = "round";
          const passe = (flou, couleur, lw) => {
            g.filter = flou ? `blur(${flou}px)` : "none";
            g.beginPath();
            pts.forEach((p, i) => g[i ? "lineTo" : "moveTo"](p[0], p[1]));
            g.strokeStyle = couleur;
            g.lineWidth = lw;
            g.stroke();
          };
          passe(9, `rgba(255,80,16,${0.55 * I})`, 14);
          passe(3, `rgba(255,140,40,${0.8 * I})`, 5);
          passe(0, `rgba(255,226,150,${Math.min(1, I)})`, 1.6);
          g.restore();
        }

        function morceauCharbon(g, poly, I, interieur) {
          g.save();
          tracePoly(g, poly);
          g.clip();
          g.drawImage(charbonTex, -80, -110, 160, 220);
          // Volume : bord assombri, face éclairée en haut à gauche.
          const vol = g.createRadialGradient(-24, -34, 10, 0, 0, 120);
          vol.addColorStop(0, "rgba(255,230,210,0.10)");
          vol.addColorStop(0.6, "rgba(0,0,0,0.05)");
          vol.addColorStop(1, "rgba(0,0,0,0.65)");
          g.fillStyle = vol;
          g.fillRect(-90, -120, 180, 240);
          if (interieur) interieur();
          g.restore();
        }

        function charbon(t) {
          if (t < 1.3 || t > 6.15) return;
          const S = echCharbon(t);
          const I = lueur(t);
          const fin = 1 - phase(t, 5.9, 6.12);
          const k = eo(phase(t, 4.35, 4.62));
          const k2 = eio(phase(t, 4.62, 5.95));
          ctx.save();
          ctx.globalAlpha = fin;
          ctx.translate(CX, CY);
          // Halo de chaleur sur le plan de travail.
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const halo = ctx.createRadialGradient(0, 10, 10, 0, 10, 300 * S);
          halo.addColorStop(0, `rgba(255,110,30,${0.22 * I})`);
          halo.addColorStop(1, "rgba(255,60,10,0)");
          ctx.fillStyle = halo;
          ctx.fillRect(-400, -400, 800, 800);
          ctx.restore();
          ctx.scale(S * lerp(1, 0.96, 1 - fin), S * lerp(1, 0.96, 1 - fin));

          const ouvert = t >= 4.35;
          if (!ouvert) {
            ombre(ctx, S * 1.1);
            tracePoly(ctx, ROCHE);
            ctx.fillStyle = "#1A1614";
            ctx.fill();
            sansOmbre(ctx);
            morceauCharbon(ctx, ROCHE, I);
            VEINES.forEach((v) => ligneLueur(ctx, v, I * 0.9));
            ligneLueur(ctx, FISSURE, I * phase(t, 3.6, 4.35) * 1.2);
          } else {
            // Coupelle + cavité incandescente.
            ombre(ctx, S);
            tracePoly(ctx, COUPELLE);
            ctx.fillStyle = "#1A1614";
            ctx.fill();
            sansOmbre(ctx);
            morceauCharbon(ctx, COUPELLE, I, () => {
              const cav = ctx.createRadialGradient(4, 14, 4, 4, 14, 66);
              cav.addColorStop(0, `rgba(255,236,160,${0.95 * I})`);
              cav.addColorStop(0.35, `rgba(255,130,36,${0.9 * I})`);
              cav.addColorStop(0.75, `rgba(170,40,10,${0.8 * I})`);
              cav.addColorStop(1, "rgba(40,8,4,0)");
              ctx.fillStyle = cav;
              ctx.beginPath();
              ctx.ellipse(4, 16, 58, 50, 0, 0, Math.PI * 2);
              ctx.fill();
            });
            VEINES.slice(2).forEach((v) => ligneLueur(ctx, v, I * 0.8));
            ligneLueur(ctx, FISSURE, I);
            // Piment séché posé dans la cavité.
            const hp = poseHeros(t);
            ctx.save();
            ctx.setTransform(camera);
            ctx.globalAlpha = phase(t, 4.38, 4.52);
            ombre(ctx, hp[3]);
            sprite(ctx, items[0].spr, RES_P, hp[0], hp[1], hp[2], hp[3]);
            ctx.restore();
            // Couvercle soulevé.
            ctx.save();
            ctx.translate(lerp(0, -72, k) + lerp(0, -12, k2), lerp(0, -150, k) + lerp(0, -16, k2));
            ctx.rotate((lerp(0, -32, k) + lerp(0, -8, k2)) * DEG);
            ombre(ctx, S * (1 + k * 0.6));
            tracePoly(ctx, COUVERCLE);
            ctx.fillStyle = "#1A1614";
            ctx.fill();
            sansOmbre(ctx);
            morceauCharbon(ctx, COUVERCLE, I, () => {
              const dessous = ctx.createRadialGradient(0, -20, 4, 0, -20, 60);
              dessous.addColorStop(0, `rgba(255,150,50,${0.75 * I})`);
              dessous.addColorStop(1, "rgba(120,20,5,0)");
              ctx.fillStyle = dessous;
              ctx.fillRect(-80, -80, 160, 80);
            });
            ligneLueur(ctx, FISSURE, I * 0.8);
            ctx.restore();
            // Éclats.
            ECLATS.forEach((e, i) => {
              const q = eo(phase(t, 4.35 + i * 0.008, 4.66 + i * 0.008));
              const x = lerp(e.dep[0], e.arr[0], q) + e.arr[0] * 0.04 * k2;
              const y = lerp(e.dep[1], e.arr[1], q) + e.arr[1] * 0.04 * k2;
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(e.rot * q);
              ombre(ctx, 0.6);
              tracePoly(ctx, e.pts);
              ctx.fillStyle = "#221C19";
              ctx.fill();
              sansOmbre(ctx);
              ctx.clip();
              ctx.drawImage(charbonTex, -30, -30, 60, 60);
              ctx.restore();
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(e.rot * q);
              ligneLueur(ctx, e.pts.slice(0, 3), I * 0.6 * (1 - k2 * 0.6));
              ctx.restore();
            });
          }
          ctx.restore();
        }

        function moitiesPiment(t) {
          if (t < 1.36 || t > 3.18) return;
          // Ouverture : éclatement rapide puis retour en coque ouverte (comme la bogue d'amande).
          let dx;
          let ang;
          if (t < 1.5) {
            const k = eo(phase(t, 1.36, 1.5));
            dx = 38 * k;
            ang = 8 * k;
          } else if (t < 1.62) {
            const k = eo(phase(t, 1.5, 1.62));
            dx = lerp(38, 250, k);
            ang = lerp(8, 30, k);
          } else {
            const k = eio(phase(t, 1.62, 1.88));
            dx = lerp(250, 84, k);
            ang = lerp(30, 12, k);
          }
          const fin = 1 - phase(t, 3.0, 3.16);
          const s = 1 + 0.05 * (1 - fin);
          const ouvert = eo(phase(t, 1.38, 1.6));
          ctx.save();
          ctx.globalAlpha = fin;
          ctx.translate(CX, CY);
          ctx.scale(s, s);
          tige(t, -B, 1);
          [-1, 1].forEach((cote) => {
            ctx.save();
            ctx.translate(cote * dx, 0);
            ctx.translate(0, -B);
            ctx.rotate(cote * ang * DEG);
            ctx.translate(0, B);
            // Découpe le long de la ligne médiane.
            const clipMoitie = () => {
              ctx.beginPath();
              ctx.moveTo(pli(-B - 30), -B - 30);
              for (let y = -B - 30; y <= B + 30; y += 12) ctx.lineTo(pli(y), y);
              ctx.lineTo(cote * 400, B + 30);
              ctx.lineTo(cote * 400, -B - 30);
              ctx.closePath();
            };
            ctx.save();
            clipMoitie();
            ctx.clip();
            ombre(ctx, 1.2);
            trace(ctx, PIMENT);
            const lin = ctx.createLinearGradient(-A, 0, A, 0);
            lin.addColorStop(0, "#6A0805");
            lin.addColorStop(0.32, "#C41B10");
            lin.addColorStop(0.5, "#E5301C");
            lin.addColorStop(0.72, "#AA150C");
            lin.addColorStop(1, "#4A0503");
            ctx.fillStyle = lin;
            ctx.fill();
            sansOmbre(ctx);
            trace(ctx, PIMENT);
            ctx.clip();
            reflets(ctx);
            // Chair intérieure, placenta et graines.
            ctx.globalAlpha = ouvert * fin;
            trace(ctx, PIMENT, 0.86, pli(0) * 0.14, 0);
            const ch = ctx.createLinearGradient(cote * 70, 0, 0, 0);
            ch.addColorStop(0, "#B8301A");
            ch.addColorStop(0.6, "#EE6A3A");
            ch.addColorStop(1, "#F59A62");
            ctx.fillStyle = ch;
            ctx.fill();
            ctx.save();
            trace(ctx, PIMENT, 0.86, pli(0) * 0.14, 0);
            ctx.clip();
            ctx.filter = "blur(3px)";
            ctx.beginPath();
            for (let y = -150; y <= 120; y += 10) ctx[y === -150 ? "moveTo" : "lineTo"](pli(y) + cote * 8, y);
            ctx.strokeStyle = "rgba(250,228,190,0.85)";
            ctx.lineWidth = 22;
            ctx.stroke();
            ctx.filter = "none";
            const rg = generateur(cote > 0 ? 71 : 73);
            for (let k = 0; k < 18; k++) {
              const y = -140 + k * 14 + (rg() - 0.5) * 8;
              const x = pli(y) + cote * (6 + rg() * 20);
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(rg() * 3);
              ctx.beginPath();
              ctx.ellipse(0, 0, 7, 5.5, 0, 0, Math.PI * 2);
              const gg = ctx.createRadialGradient(-2, -2, 0.5, 0, 0, 7);
              gg.addColorStop(0, "#FFF0C0");
              gg.addColorStop(1, "#D9A850");
              ctx.fillStyle = gg;
              ctx.fill();
              ctx.strokeStyle = "rgba(140,80,30,0.5)";
              ctx.lineWidth = 0.8;
              ctx.stroke();
              ctx.restore();
            }
            ctx.restore();
            ctx.restore();
            ctx.restore();
          });
          ctx.restore();
          // Lumière de la braise sur l'intérieur du piment.
          ctx.save();
          ctx.globalAlpha = fin * ouvert;
          ctx.globalCompositeOperation = "screen";
          const l = ctx.createRadialGradient(CX, CY + 10, 20, CX, CY + 10, 260);
          l.addColorStop(0, `rgba(255,120,40,${0.28 * lueur(t)})`);
          l.addColorStop(1, "rgba(255,80,20,0)");
          ctx.fillStyle = l;
          ctx.fillRect(CX - 300, CY - 300, 600, 600);
          ctx.restore();
        }

        function ligneFente(t) {
          const k = eio(phase(t, 1.14, 1.34));
          if (k <= 0 || t >= 1.36) return;
          ctx.save();
          ctx.translate(CX, CY);
          ctx.beginPath();
          const y1 = lerp(-B + 10, B - 10, k);
          for (let y = -B + 10; y <= y1; y += 8) ctx[y === -B + 10 ? "moveTo" : "lineTo"](pli(y), y);
          ctx.strokeStyle = "rgba(40,2,1,0.85)";
          ctx.lineWidth = 3.5;
          ctx.stroke();
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = "rgba(255,110,40,0.5)";
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.restore();
        }

        function dessineItem(p, t) {
          const a = pose(p, t);
          if (!a) return;
          // Flou de mouvement : échantillons le long de la trajectoire.
          const b = pose(p, t - 1 / 60);
          if (b) {
            const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
            if (d > 5) {
              const n = Math.min(6, Math.ceil(d / 7));
              for (let j = n; j >= 1; j--) {
                const q = pose(p, t - (j / n) * (1 / 60));
                if (q) sprite(ctx, p.spr, p.res, q[0], q[1], q[2], q[3], 0.32 * (1 - j / (n + 1)));
              }
            }
          }
          ombre(ctx, a[3] * (p.piment ? 1 : 0.35), p.piment ? 1 : 0.8);
          sprite(ctx, p.spr, p.res, a[0], a[1], a[2], a[3], a[4]);
          sansOmbre(ctx);
        }

        function piments(t) {
          if (t < 6.12) return;
          // Ombre de contact du tas.
          const tasV = phase(t, 10.3, 10.7);
          if (tasV > 0) {
            const q = tas(t, CX, CY);
            const m = eio(phase(t, 11.65, 12.25));
            ctx.save();
            ctx.globalAlpha = 0.5 * tasV;
            ctx.filter = "blur(26px)";
            ctx.beginPath();
            ctx.ellipse(q[0] + 16, q[1] + 22, 290 * lerp(1, 0.96, m), 290 * lerp(1, 1.45, m), 0, 0, Math.PI * 2);
            ctx.fillStyle = "#120402";
            ctx.fill();
            ctx.restore();
          }
          if (tasV > 0) {
            const q = tas(t, CX, CY);
            const m = eio(phase(t, 11.65, 12.25));
            const e = lerp(0.7, 1, eo(tasV));
            const R = (R_TAS + 26) * e;
            ctx.save();
            ctx.globalAlpha = tasV;
            ctx.translate(q[0], q[1]);
            ctx.scale(lerp(1, 0.96, m) * lerp(1, 1.05, eio(phase(t, 10.6, 11.65))), lerp(1, 1.45, m) * lerp(1, 1.05, eio(phase(t, 10.6, 11.65))));
            ctx.drawImage(poudre, -R, -R, 2 * R, 2 * R);
            ctx.restore();
          }
          for (const p of ordre) dessineItem(p, t);
        }

        // Dos du sachet (ouverture), sous le tas.
        const hautSachet = (t) => lerp(2500, 1150, eo(phase(t, 11.65, 12.32)));
        function dosSachet(t) {
          const y = hautSachet(t);
          if (y > 1990) return;
          ctx.save();
          ctx.translate(CX, y);
          ctx.beginPath();
          ctx.moveTo(-258, 20);
          ctx.quadraticCurveTo(0, -34, 258, 20);
          ctx.lineTo(258, 60);
          ctx.lineTo(-258, 60);
          ctx.closePath();
          const g = ctx.createLinearGradient(0, -30, 0, 60);
          g.addColorStop(0, "#8A6240");
          g.addColorStop(1, "#3E2616");
          ctx.fillStyle = g;
          ctx.fill();
          ctx.restore();
        }

        // ---------- Effets (calque du dessus) ----------
        const BRAISES = [];
        for (let k = 0; k < 44; k++) {
          const flou = k < 8;
          BRAISES.push({
            x: alea() * W,
            y: alea() * H,
            v: 40 + alea() * 90,
            amp: 10 + alea() * 30,
            f: 0.6 + alea() * 1.4,
            ph: alea() * 6,
            s: flou ? 34 + alea() * 40 : 6 + alea() * 12,
            flou,
          });
        }
        const PREMIER_PLAN = [];
        for (let k = 0; k < 20; k++) {
          const a = alea() * Math.PI * 2;
          PREMIER_PLAN.push({
            spr: EPICES[Math.floor(alea() * 6)],
            dep: [CX + Math.cos(a) * 1300, CY + Math.sin(a) * 1300],
            arr: [CX - Math.cos(a) * 1300 + (alea() - 0.5) * 600, CY - Math.sin(a) * 1300 + (alea() - 0.5) * 600],
            t0: 9.9 + alea() * 0.25,
            s: 2.6 + alea() * 1.8,
            flou: 5 + alea() * 6,
            rot: alea() * 360,
          });
        }

        function effets(t, frame) {
          fx.clearRect(0, 0, W, H);
          // Fumée qui traverse le cadre.
          fx.save();
          fx.globalCompositeOperation = "screen";
          const intens = 0.03 + 0.06 * phase(t, 3.0, 4.3) * (1 - phase(t, 6.0, 7.0)) + 0.05 * phase(t, 11.6, 12.4);
          for (let k = 0; k < 3; k++) {
            fx.save();
            fx.globalAlpha = intens * (k === 1 ? 1 : 0.7);
            fx.translate(CX + Math.sin(t * 0.3 + k * 2) * 160 + (k - 1) * 260, CY - 120 - t * (22 + k * 8) + k * 300);
            fx.rotate(t * 0.05 * (k % 2 ? -1 : 1) + k);
            const s = 900 + k * 200;
            fx.drawImage(fumee, -s / 2, -s / 2, s, s);
            fx.restore();
          }
          // Panache au-dessus de la braise.
          const pan = phase(t, 3.1, 3.6) * (1 - phase(t, 5.9, 6.3));
          if (pan > 0) {
            for (let k = 0; k < 3; k++) {
              const u = ((t * 0.45 + k / 3) % 1);
              fx.save();
              fx.globalAlpha = 0.22 * pan * Math.sin(u * Math.PI);
              fx.translate(CX + Math.sin(u * 5 + k) * 40, CY - 60 - u * 520);
              fx.rotate(u * 1.5 + k);
              const s = 260 + u * 420;
              fx.drawImage(fumee, -s / 2, -s / 2, s, s);
              fx.restore();
            }
          }
          fx.restore();

          // Braises flottantes et bokeh.
          fx.save();
          fx.globalCompositeOperation = "lighter";
          const E = 0.35 + 0.65 * phase(t, 3.0, 3.8) * (1 - 0.45 * phase(t, 6.2, 7.0)) + 0.15 * phase(t, 11.8, 12.4);
          for (const b of BRAISES) {
            const y = ((((b.y - b.v * t) % (H + 200)) + H + 200) % (H + 200)) - 100;
            const x = b.x + Math.sin(t * b.f + b.ph) * b.amp;
            const sc = 0.6 + 0.4 * Math.sin(t * 7 * b.f + b.ph);
            fx.globalAlpha = E * (b.flou ? 0.16 : 0.75 * sc);
            fx.drawImage(braiseSprite, x - b.s / 2, y - b.s / 2, b.s, b.s);
          }
          // Gerbe d'étincelles à l'éclatement.
          const te = t - 4.35;
          if (te > 0 && te < 0.9) {
            const S = echCharbon(t) * cadrage(t);
            for (const e of ETINCELLES) {
              if (te > e.vie) continue;
              const x = CX + (e.x0 + e.vx * te) * S;
              const y = CY + (e.y0 + e.vy * te + 700 * te * te) * S;
              const vx = e.vx * S;
              const vy = (e.vy + 1400 * te) * S;
              const a = 1 - te / e.vie;
              fx.beginPath();
              fx.moveTo(x, y);
              fx.lineTo(x - vx * 0.022, y - vy * 0.022);
              fx.strokeStyle = `rgba(255,${Math.round(150 + 90 * a)},${Math.round(60 * a)},${a})`;
              fx.lineWidth = 2.4;
              fx.lineCap = "round";
              fx.stroke();
            }
            // Éclair chaud.
            fx.globalAlpha = 0.35 * (1 - eo(phase(te, 0, 0.35)));
            const fl = fx.createRadialGradient(CX, CY, 0, CX, CY, 700);
            fl.addColorStop(0, "rgba(255,170,80,1)");
            fl.addColorStop(1, "rgba(255,80,20,0)");
            fx.fillStyle = fl;
            fx.fillRect(0, 0, W, H);
          }
          fx.restore();

          // Épices au premier plan, floues (profondeur de champ) pendant l'arrivée du tas.
          for (const p of PREMIER_PLAN) {
            const k = phase(t, p.t0, p.t0 + 0.42);
            if (k <= 0 || k >= 1) continue;
            fx.save();
            fx.filter = `blur(${p.flou}px)`;
            fx.globalAlpha = 0.9;
            sprite(fx, p.spr, RES_E, lerp(p.dep[0], p.arr[0], k), lerp(p.dep[1], p.arr[1], k), p.rot + k * 200, p.s);
            fx.restore();
          }

          // Étalonnage : vignette + chaleur + grain.
          const vig = fx.createRadialGradient(CX, 880, 360, CX, 900, 1180);
          vig.addColorStop(0, "rgba(10,3,2,0)");
          vig.addColorStop(1, "rgba(10,3,2,0.8)");
          fx.fillStyle = vig;
          fx.fillRect(0, 0, W, H);
          fx.save();
          fx.globalCompositeOperation = "soft-light";
          fx.fillStyle = "rgba(255,150,80,0.16)";
          fx.fillRect(0, 0, W, H);
          fx.globalCompositeOperation = "overlay";
          fx.globalAlpha = 0.1;
          fx.drawImage(grains[frame % 3], 0, 0, W, H);
          fx.restore();
        }

        // ---------- Rendu d'une image ----------
        function rendu(t) {
          ctx.clearRect(0, 0, W, H);
          sansOmbre(ctx);
          fond(t);
          const Z = cadrage(t);
          ctx.save();
          ctx.translate(CX, CY);
          ctx.scale(Z, Z);
          ctx.translate(-CX, -CY);
          camera = ctx.getTransform();
          if (t < 1.36) {
            pimentFrais(t);
            ligneFente(t);
          }
          charbon(t);
          moitiesPiment(t);
          dosSachet(t);
          piments(t);
          ctx.restore();

          sachetFace.setAttribute("transform", `translate(${CX} ${hautSachet(t).toFixed(1)})`);

          const k = eo(phase(t, 12.3, 12.85));
          titre.style.opacity = k.toFixed(3);
          titre.style.transform = `translateY(${lerp(26, 0, k).toFixed(1)}px)`;
          titre.querySelector(".sous").style.opacity = eo(phase(t, 12.55, 12.95)).toFixed(3);

          effets(t, Math.floor(t * 24));
        }

        const tl = gsap.timeline({ paused: true });
        const horloge = { t: 0 };
        tl.to(horloge, { t: DUREE, duration: DUREE, ease: "none", onUpdate: () => rendu(horloge.t) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        rendu(0);
      })();
    </script>
